name: Build and deploy
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test routing, recovery and UI logic
        run: dotnet test tests/RustDeskHop.Tests/RustDeskHop.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Publish self-contained build
        run: dotnet publish RustDeskCompanion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=0.0.0-ci.${{ github.run_number }} --output publish
      - name: Package and validate distribution
        shell: pwsh
        run: |
          ./tools/Collect-ReleaseNotices.ps1 -AssetsFile obj/project.assets.json -PublishDirectory publish -InnoCompilerDirectory "${env:ProgramFiles(x86)}\Inno Setup 6"
          ./tools/Test-ReleaseTools.ps1 -PublishDirectory publish
          ./tools/Build-Installer.ps1 -PublishDirectory publish -OutputDirectory artifacts -Version "0.0.0-ci.${{ github.run_number }}"
          Compress-Archive -Path publish/* -DestinationPath artifacts/RustDeskHop-build.zip
      - name: Disposable-runner install, upgrade, launch and uninstall smoke test
        shell: pwsh
        run: ./tools/Test-Installer.ps1 -Installer "artifacts/RustDeskHop-v0.0.0-ci.${{ github.run_number }}-win-x64-setup.exe"
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RustDeskHop-build-${{ github.run_number }}
          path: |
            artifacts/*
            TestResults/*.trx
            ${{ runner.temp }}/rustdeskhop-install-test-*/*.log
          retention-days: 30
