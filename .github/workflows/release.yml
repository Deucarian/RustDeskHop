name: Release RustDeskHop
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate version, source branch and public-readiness gates
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./tools/Test-ReleaseGate.ps1 -Version $version -SigningEnabled $env:SIGNING_ENABLED
          $branch = if ($version.Contains('-')) { 'develop' } else { 'main' }
          git merge-base --is-ancestor HEAD "origin/$branch"
          if ($LASTEXITCODE -ne 0) { throw "Release commit must already be merged into $branch" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test tests/RustDeskHop.Tests/RustDeskHop.Tests.csproj -c Release
      - name: Publish
        run: dotnet publish RustDeskCompanion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=${{ env.RELEASE_VERSION }} --output publish
      - name: Collect notices from resolved runtime packages
        shell: pwsh
        run: ./tools/Collect-ReleaseNotices.ps1 -AssetsFile obj/project.assets.json -PublishDirectory publish -InnoCompilerDirectory "${env:ProgramFiles(x86)}\Inno Setup 6"
      - name: Upload application for approved signing
        id: unsigned-app
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-application
          path: publish/RustDeskHop.exe
      - name: Sign application
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: Verify and use signed application
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          ./tools/Test-Signature.ps1 -Path signed-app/RustDeskHop.exe
          Copy-Item signed-app/RustDeskHop.exe publish/RustDeskHop.exe -Force
      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          ./tools/Build-Installer.ps1 -PublishDirectory publish -OutputDirectory installer -Version $env:RELEASE_VERSION
          ./tools/Test-Installer.ps1 -Installer "installer/RustDeskHop-v$env:RELEASE_VERSION-win-x64-setup.exe"
      - name: Upload installer for approved signing
        id: unsigned-installer
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installer
          path: installer/*.exe
      - name: Sign installer
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Verify and use signed installer
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $name = "RustDeskHop-v$env:RELEASE_VERSION-win-x64-setup.exe"
          ./tools/Test-Signature.ps1 -Path "signed-installer/$name"
          Copy-Item "signed-installer/$name" "installer/$name" -Force
      - name: Assemble immutable versioned assets
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        shell: pwsh
        run: ./tools/Package-Release.ps1 -Version $env:RELEASE_VERSION -PublishDirectory publish -InstallerDirectory installer -OutputDirectory release -SigningEnabled $env:SIGNING_ENABLED
      - name: Attest published release assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -File | Select-Object -ExpandProperty FullName)
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME) + $files + @('--verify-tag', '--title', "RustDeskHop $env:GITHUB_REF_NAME", '--notes-file', 'release-notes.md', '--generate-notes')
          if ($env:RELEASE_VERSION.Contains('-')) { $releaseArgs += @('--prerelease', '--latest=false') }
          else { $releaseArgs += '--latest' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
