<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>RustDeskHop</title>
  <desc>A large hopping bunny in front of an 18% slimmer RustDesk-derived ring, on white.</desc>
  <!-- Single editable master. The ring originates from RustDesk's installed
