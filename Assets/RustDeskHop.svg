       Source SHA256: 4D6ECC2B45571382576049095435F41576C02E895B8766EF3F300623C35B3488.
       User-approved refinement: expand the inner contour to reduce band thickness
       by about 18%, keeping the outside diameter and characteristic rounded ends.
       RustDesk's branding remains third-party artwork; see the README attribution. -->
  <defs>
    <linearGradient id="a" x1=".148" x2=".845" y1=".851" y2=".154" gradientTransform="matrix(26.301 0 0 26.331 90.674 911.757)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0071ff"/><stop offset="1" stop-color="#00bfe1"/></linearGradient>
